name: Sync upstream

# 每天北京时间 02:00（UTC 18:00）自动把官方仓库 main 的更新合并进本 fork
# 也可在 GitHub Actions 页面手动 "Run workflow" 立即同步
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "sync-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Sync with upstream (w1249178256/xyzw_web_helper)
        run: |
          git remote add upstream https://github.com/w1249178256/xyzw_web_helper.git || git remote set-url upstream https://github.com/w1249178256/xyzw_web_helper.git
          git fetch upstream main
          # 备份本 fork 特有的 Cloudflare 部署配置（不能被官方旧版覆盖）
          cp wrangler.toml /tmp/wrangler.toml.ours
          # 合并上游代码；冲突时以本 fork 为准（本 fork 只改了部署配置）
          git merge upstream/main --no-edit -X ours || true
          # 强制恢复本 fork 的部署配置
          cp /tmp/wrangler.toml.ours wrangler.toml
          git add -A
          if git diff --cached --quiet; then
            echo "无更新，无需提交"
          else
            git commit -m "chore: sync upstream, keep fork Cloudflare deploy config [skip ci]"
            git push origin main
          fi
