name: Sync upstream

# 每天北京时间 02:00（UTC 18:00）自动把官方仓库 main 的更新合并进本 fork
# 也可在 GitHub Actions 页面手动 "Run workflow" 立即同步
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "sync-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Sync with upstream (w1249178256/xyzw_web_helper)
        run: |
          git remote add upstream https://github.com/w1249178256/xyzw_web_helper.git || git remote set-url upstream https://github.com/w1249178256/xyzw_web_helper.git
          git fetch upstream main

          # 优先快进；若有本地改动则普通合并，冲突时以本 fork 的部署配置为准（-X ours）
          MERGED=0
          git merge upstream/main --ff-only || MERGED=1
          if [ "$MERGED" = "1" ]; then
            if ! git merge upstream/main --no-edit -X ours; then
              # 极端情况（如上游删除 / 重写文件）导致冲突：除部署配置外一律取上游
              git checkout --theirs -- . || true
              git add -A || true
            fi
          fi

          # 固定部署配置：wrangler.toml 必须保持 Pages 形态，防止被上游旧写法覆盖
          cat > wrangler.toml <<'EOF'
          name = "xyzw-web-helper"
          compatibility_date = "2023-12-01"
          pages_build_output_dir = "dist"
          EOF

          git add -A
          if git diff --cached --quiet; then
            echo "无需提交（已是最新）"
          else
            git commit -m "chore(sync): 固定 Cloudflare Pages 部署配置"
            git push origin main
          fi
