name: Sync upstream & Deploy to Cloudflare Pages

# 自动跟随官方仓库更新并部署到 Cloudflare Pages（*.pages.dev，大陆可直连）
# - 每天北京时间 02:00 同步官方 w1249178256/xyzw_web_helper 的 main 并部署
# - 推送到 main 时自动部署（自己的改动）
# - 可在 Actions 页面手动 "Run workflow" 立即执行
on:
  schedule:
    - cron: "0 18 * * *"   # UTC 18:00 = 北京时间次日 02:00
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-pages-deploy

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 同步官方上游（仅定时/手动触发，自己的 push 不重复同步） ----------
      - name: Configure git
        if: github.event_name != 'push'
        run: |
          git config user.name "sync-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Sync with upstream
        if: github.event_name != 'push'
        run: |
          git remote add upstream https://github.com/w1249178256/xyzw_web_helper.git || git remote set-url upstream https://github.com/w1249178256/xyzw_web_helper.git
          git fetch upstream main
          MERGED=0
          git merge upstream/main --ff-only || MERGED=1
          if [ "$MERGED" = "1" ]; then
            if ! git merge upstream/main --no-edit -X ours; then
              git checkout --theirs -- . || true
              git add -A || true
            fi
          fi
          # 固定部署配置：wrangler.toml 必须保持 Pages 形态，防止被上游旧写法覆盖
          cat > wrangler.toml <<'EOF'
          name = "xyzw-web-helper"
          compatibility_date = "2023-12-01"
          pages_build_output_dir = "dist"
          EOF
          git add -A
          if git diff --cached --quiet; then
            echo "无需提交（已是最新）"
          else
            git commit -m "chore(sync): 固定 Cloudflare Pages 部署配置"
            git push origin main
          fi

      # ---------- 构建 + 部署 ----------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Inject SPA fallback (history 路由刷新 404 修复)
        run: node .github/postbuild-spa.mjs

      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler@4 pages deploy dist --project-name xyzw-web-helper --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "70a675d7fbea9e50893da24894ba4f02"
